name: Build and test

on:
  pull_request:
  workflow_dispatch:
  workflow_call: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Check for unused usings
        run: dotnet format style Kontext.slnx --diagnostics IDE0005 --severity info --verify-no-changes

      - name: Set GitHub OAuth client id
        if: ${{ vars.KONTEXT_GITHUB_CLIENT_ID != '' }}
        shell: pwsh
        env:
          CLIENT_ID: ${{ vars.KONTEXT_GITHUB_CLIENT_ID }}
        run: |
          $path = 'src/Kontext/appsettings.json'
          $settings = Get-Content $path -Raw | ConvertFrom-Json
          $settings.GitHub.ClientId = $env:CLIENT_ID
          $settings | ConvertTo-Json -Depth 5 | Set-Content $path

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: |
            src/*/bin/Release
            tests/*/bin/Release
          if-no-files-found: error
          retention-days: 1

  unit-test:
    name: Run unit tests
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Download build output
        uses: actions/download-artifact@v8
        with:
          name: build-output

      - name: Unit test
        run: dotnet test --no-build --configuration Release --logger GitHubActions --filter "FullyQualifiedName~.UnitTests."

      - name: Architecture test
        run: dotnet test --no-build --configuration Release --logger GitHubActions --filter "FullyQualifiedName~.ArchitectureTests.|FullyQualifiedName~.CompositionTests."

  integration-test:
    name: Run integration tests
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Download build output
        uses: actions/download-artifact@v8
        with:

      - name: Integration test
        run: dotnet test --no-build --configuration Release --logger GitHubActions --filter "FullyQualifiedName~.IntegrationTests."

  ui-test:
    name: Run UI tests
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Download build output
        uses: actions/download-artifact@v8
        with:
          name: build-output

      - name: UI test
        run: dotnet test --no-build --configuration Release --logger GitHubActions --filter "FullyQualifiedName~.UiTests."
