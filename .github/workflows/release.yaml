name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  test:
    name: Build and test
    uses: ./.github/workflows/build-and-test.yaml

  release:
    needs: test
    runs-on: windows-latest
    strategy:
      matrix:
        platform: [x64]
        include:
          - platform: x64
            rid: win-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract version from tag
        id: version
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $displayVersion = $env:TAG.TrimStart('v', 'V')
          if ($displayVersion -notmatch '^\d+\.\d+\.\d+$') {
            Write-Error "Release tag '$env:TAG' must look like v1.2.3 (got '$displayVersion' after stripping the prefix)."
            exit 1
          }
          $manifestVersion = $displayVersion + '.0'
          "DISPLAY_VERSION=$displayVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "VERSION=$manifestVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Update Package.appxmanifest version
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          $manifest = "src\Kontext\Package.appxmanifest"
          $pattern = '(<Identity\b[^>]*?\sVersion=")\d+\.\d+\.\d+\.\d+(")'
          $content = Get-Content $manifest -Raw
          if ($content -notmatch $pattern) {
            Write-Error "Could not find the <Identity> version in $manifest."
            exit 1
          }
          [regex]::Replace($content, $pattern, "`${1}$env:VERSION`${2}") | Set-Content $manifest -NoNewline

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Load nuget cache
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Set GitHub OAuth client id
        shell: pwsh
        env:
          CLIENT_ID: ${{ vars.KONTEXT_GITHUB_CLIENT_ID }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CLIENT_ID)) {
            Write-Error "Set the KONTEXT_GITHUB_CLIENT_ID repository variable; without it the released app cannot sign in."
            exit 1
          }
          $path = 'src/Kontext/appsettings.json'
          $settings = Get-Content $path -Raw | ConvertFrom-Json
          $settings.GitHub.ClientId = $env:CLIENT_ID
          $settings | ConvertTo-Json -Depth 5 | Set-Content $path

      - name: Install signing certificate
        id: certificate
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          $pfx = "${{ github.workspace }}\cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
          $securePassword = ConvertTo-SecureString -String $env:CERT_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword
          Remove-Item -Path $pfx -Force
          "THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build and Package MSIX
        shell: pwsh
        run: |
          dotnet publish src\Kontext\Kontext.csproj `
            -c Release `
            -r ${{ matrix.rid }} `
            -p:Platform=${{ matrix.platform }} `
            -p:WindowsPackageType=MSIX `
            -p:GenerateAppxPackageOnBuild=true `
            -p:AppxPackageDir="${{ github.workspace }}\AppxPackages\" `
            -p:AppxPackageSigningEnabled=true `
            -p:PackageCertificateThumbprint=${{ steps.certificate.outputs.THUMBPRINT }} `
            -p:AppxPackageSigningTimestampDigestAlgorithm=SHA256 `
            -p:AppxPackageSigningTimestampServerUrl=http://timestamp.digicert.com `
            -p:AppxBundle=Never

      - name: Export public certificate
        if: matrix.platform == 'x64'
        shell: pwsh
        run: |
          $cert = Get-Item "Cert:\CurrentUser\My\${{ steps.certificate.outputs.THUMBPRINT }}"
          Export-Certificate -Cert $cert -FilePath "${{ github.workspace }}\Kontext.cer" | Out-Null

      - name: Remove signing certificate
        if: always()
        shell: pwsh
        run: |
          Remove-Item -Path "${{ github.workspace }}\cert.pfx" -Force -ErrorAction SilentlyContinue
          if ("${{ steps.certificate.outputs.THUMBPRINT }}") {
            Remove-Item -Path "Cert:\CurrentUser\My\${{ steps.certificate.outputs.THUMBPRINT }}" -Force -ErrorAction SilentlyContinue
          }

      - name: Rename MSIX with platform suffix
        shell: pwsh
        run: |
          $package = Get-ChildItem -Path "${{ github.workspace }}\AppxPackages" -Filter "*.msix" -Recurse |
            Select-Object -First 1
          $newName = Join-Path $package.DirectoryName "Kontext_${{ steps.version.outputs.DISPLAY_VERSION }}_${{ matrix.platform }}.msix"
          Rename-Item -Path $package.FullName -NewName $newName

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            AppxPackages/**/*.msix
            *.cer
