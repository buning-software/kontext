name: Setup
description: Installs the .NET SDK, loads the NuGet cache and restores the solution. Run after checkout.

runs:
  using: composite
  steps:
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '11.0.x'

    - name: Load nuget cache
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj', '**/Directory.Build.props') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Install dependencies
      shell: bash
      run: dotnet restore
